<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">

<meta name="apple-mobile-web-app-title" content="D’tox">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1A1A2E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Montserrat:wght@800&display=swap" rel="stylesheet">
<meta name="description" content="D’tox. D for Dextor. Physical · Practice · Peace.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23FFB400'/%3E%3Ccircle cx='32' cy='32' r='23' fill='none' stroke='%231A1A2E' stroke-opacity='.35' stroke-width='3'/%3E%3Ctext x='32' y='45' text-anchor='middle' font-size='38' font-weight='900' font-family='Arial Black,Arial,sans-serif' fill='%231A1A2E'%3ED%3C/text%3E%3C/svg%3E">
<title>D’tox · D for Dextor</title>
<style>
:root{--bg:#FFB400;--card:#FFC63D;--ink:#1A1A2E;--mute:#4A4A66;--line:#D99A00;--in:#F5F5F7;--wm:#1A1A2E;--btn:#1A1A2E;--btnt:#FFB400;--gold:#FFB400;--on:#F5F5F7;--bad:#B3261E;--phys:#1A1A2E;--prac:#2B44C7;--peace:#0A6B4B;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);color-scheme:light}

:root[data-theme="dark"]{--bg:#1A1A2E;--card:#25253D;--ink:#F5F5F7;--mute:#A7A7B7;--line:#3A3A5C;--in:#1A1A2E;--wm:#FFB400;--btn:#FFB400;--btnt:#1A1A2E;--on:#1A1A2E;--bad:#FF6B6B;--phys:#FFB400;--prac:#8FA8FF;--peace:#5BD6A8;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.4}
.app{max-width:620px;margin:0 auto;padding:16px 16px 100px}
header{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:14px}
h1{font-size:34px;margin:0;letter-spacing:-.05em;font-weight:900;line-height:1;color:var(--wm)}.tag{margin:5px 0 1px;color:var(--ink)}
.sub{color:var(--mute);font-size:13px}
.hr{display:flex;gap:8px;align-items:center}
.pill{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:7px 12px;font-size:13px;font-weight:600;white-space:nowrap;color:var(--ink)}
button.pill{cursor:pointer;min-width:40px;min-height:40px}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));z-index:5}
nav button{flex:1;border:0;background:none;color:var(--mute);font-size:12px;font-weight:600;padding:6px;min-height:48px;cursor:pointer;border-radius:10px}
nav button b{display:block;font-size:20px;line-height:1.1}
nav button.on{color:var(--btnt);background:var(--btn)}
.banner{background:#fff1d6;color:#5a3b00;border:1px solid #e8c36a;border-radius:12px;padding:10px 12px;font-size:13px;margin-bottom:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:14px;border-top:4px solid var(--c,var(--line))}
.ch{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px;gap:8px}
.ch h2{margin:0;font-size:16px;color:var(--c,var(--ink))}
.ch h2 small{color:var(--mute);font-weight:500;font-size:12px;margin-left:6px}
.pct{font-weight:700;font-size:14px}
.bar{height:8px;background:var(--line);border-radius:9px;overflow:hidden;margin-bottom:8px}
.bar i{display:block;height:100%;background:var(--c);transition:width .25s}
.t{display:flex;align-items:center;gap:8px;padding:10px 0;border-top:1px solid var(--line)}
.tl{flex:1;min-width:0}
.tl label,.tl b{font-size:15px;font-weight:600;display:block}
.tl small{color:var(--mute);font-size:12px;display:block}
input,select,textarea{font:inherit;font-size:16px;color:var(--ink);background:var(--in);border:1px solid var(--line);border-radius:10px;padding:9px 10px;width:100%;min-height:44px}
.t input[type=number]{width:84px;text-align:center}
textarea{resize:vertical;min-height:56px;margin-top:8px}
.ok{border:2px solid var(--c);background:transparent;color:var(--c);min-width:48px;height:44px;border-radius:12px;font-weight:700;cursor:pointer;flex:none;font-size:14px}
.ok.on{background:var(--c);color:var(--on)}
.btn{border:0;background:var(--btn);color:var(--btnt);border-radius:12px;padding:10px 16px;font-weight:600;cursor:pointer;min-height:44px;font-size:14px}
.btn.g{background:var(--line);color:var(--ink)}
.btn.d{background:transparent;color:var(--bad);border:1px solid var(--line)}
.row{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.row>*{flex:1;min-width:110px}
.datebar{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.datebar>div{flex:1;text-align:center}
.datebar button{border:1px solid var(--line);background:var(--card);color:var(--ink);width:44px;height:44px;border-radius:12px;font-size:18px;cursor:pointer;flex:none}
.datebar b{display:block;font-size:15px}
.datebar small{color:var(--mute);font-size:12px}
.datebar input[type=date]{margin-top:4px;min-height:38px;padding:5px 8px;text-align:center}
table{border-collapse:separate;border-spacing:4px;width:100%}
th{font-size:11px;color:var(--mute);font-weight:500;text-align:center}
td.cell{height:34px;border-radius:8px;background:var(--line);text-align:center;font-size:11px;min-width:34px}
td.cell.m{background:transparent;border:1px dashed var(--mute);color:var(--mute)}
td.cell.f{background:transparent;color:var(--mute)}
.lbl{font-size:13px;font-weight:600;color:var(--c);white-space:nowrap}
.hint{color:var(--mute);font-size:12px;margin-top:8px}
.kpi{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.kpi div{background:var(--card);border:1px solid var(--line);border-top:4px solid var(--c);border-radius:14px;padding:10px;text-align:center}
.kpi b{font-size:22px;display:block;color:var(--c)}
.kpi small{color:var(--mute);font-size:11px;display:block}
.up{color:var(--peace)}.dn{color:var(--bad)}
.tw{display:flex;justify-content:space-between;gap:8px;font-size:13px;padding:5px 0;border-top:1px solid var(--line)}
.chart{display:flex;align-items:flex-end;gap:10px;overflow-x:auto;padding-top:6px}
.wk{display:flex;flex-direction:column;align-items:center;gap:4px;flex:none}
.bars{display:flex;align-items:flex-end;gap:2px;height:100px}
.bars i{display:block;width:11px;border-radius:3px 3px 0 0;background:var(--c);min-height:2px}
.bars i.p{opacity:.5}
.wk small{font-size:11px;color:var(--mute)}
.ins{font-size:14px;margin:0 0 8px}
svg text{fill:var(--mute);font-size:10px}
.leg{display:flex;gap:12px;font-size:12px;color:var(--mute);margin-top:4px;flex-wrap:wrap}
.leg b{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;background:var(--c)}
.empty{text-align:center;color:var(--mute);padding:18px 8px;font-size:14px}
.err{color:var(--bad);font-size:13px;margin-top:8px}
.fl{font-size:12px;color:var(--mute);margin:10px 0 2px;display:block}
.sm{display:flex;gap:6px;margin-top:6px}
.sm .btn{padding:6px 12px;min-height:36px;font-size:13px}
html,body{max-width:100%;overflow-x:hidden;-webkit-text-size-adjust:100%}
body{-webkit-tap-highlight-color:transparent}
button{touch-action:manipulation}
.app{padding-left:max(16px,env(safe-area-inset-left));padding-right:max(16px,env(safe-area-inset-right))}
.tl small,.hint,.datebar small,.kpi small{font-size:13px}
.t input[type=number]{width:76px}
.sw{position:relative;flex:none;width:54px;height:32px;border:2px solid var(--c);border-radius:16px;background:transparent;cursor:pointer;padding:0;transition:background .2s}
.sw::after{content:"";position:absolute;inset:-8px -4px}
.sw i{position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--c);transition:transform .2s,background .2s}
.sw.on{background:var(--c)}
.sw.on i{transform:translateX(22px);background:var(--on)}
.sw:disabled{opacity:.4;cursor:not-allowed}
.lk{opacity:.7}
@media (max-width:370px){h1{font-size:30px}}
body{font-family:Inter,-apple-system,"Segoe UI",Roboto,sans-serif;font-weight:400}
button,input,select,textarea{font-family:inherit}
h1{font-family:Montserrat,Inter,sans-serif;font-weight:800}
.tag{font-family:Inter,-apple-system,sans-serif;font-weight:600;font-size:13px}
.ch h2,details>summary{font-weight:700}
.tl label,.tl b,.btn,nav button,.seg button{font-weight:600}
.pct,.kpi b,.g2 b,.stp{font-weight:700}
.t.st{display:block}
.chips{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.stp{min-width:48px;height:44px;border-radius:12px;border:2px solid var(--c);background:transparent;color:var(--c);font-size:15px;cursor:pointer}
.stp.on{background:var(--c);color:var(--on)}
.seg{display:flex;gap:6px;background:var(--line);padding:4px;border-radius:12px;margin-bottom:10px}
.seg button{flex:1;border:0;background:transparent;color:var(--mute);padding:9px;border-radius:9px;font-size:14px;cursor:pointer;min-height:40px}
.seg button.on{background:var(--btn);color:var(--btnt)}
details>summary{cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center;font-size:16px;min-height:32px}
details>summary::-webkit-details-marker{display:none}
.stack{display:flex;height:10px;border-radius:6px;overflow:hidden;margin:6px 0}
.stack i{display:block;height:100%}
.mrow{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--line);font-size:14px}
.mrow small{display:block;color:var(--mute);font-size:13px}
.mrow button:not(.btn){border:0;background:none;color:var(--mute);font-size:16px;cursor:pointer;padding:6px;min-width:36px;min-height:36px}
.due{border-top-color:var(--btn)}
.tag2{font-size:11px;font-weight:600;color:var(--mute);border:1px solid var(--line);border-radius:6px;padding:1px 5px;margin-left:6px}
.g2{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.g2 div{background:var(--bg);border-radius:12px;padding:10px}
.g2 b{display:block;font-size:20px}
.g2 small{color:var(--mute);font-size:13px}
.wrn{color:var(--bad);font-size:13px;margin:6px 0}
#splash{position:fixed;inset:0;z-index:100;background:var(--bg);color:var(--wm);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;transition:opacity .45s}
#splash.hide{opacity:0;pointer-events:none}
#splash .wm{font-family:Montserrat,Inter,sans-serif;font-weight:800;font-size:clamp(64px,22vw,112px);letter-spacing:-.04em;line-height:1;display:flex}
#splash .wm span{display:inline-block;opacity:0;animation:emb .9s cubic-bezier(.2,.7,.2,1) calc(.2s + var(--i)*.25s) forwards}
#splash .tg{font-weight:600;font-size:clamp(14px,4vw,18px);letter-spacing:.02em;opacity:0;animation:tg-in .6s ease 1.8s forwards}
@keyframes emb{0%{opacity:0;filter:blur(16px);transform:translateY(8px) scale(1.12);text-shadow:none}60%{opacity:1}100%{opacity:1;filter:blur(0);transform:none;text-shadow:0 1px 0 rgba(255,255,255,.4),0 -1px 0 rgba(0,0,0,.28),0 10px 22px rgba(0,0,0,.3)}}
@keyframes tg-in{from{opacity:0;transform:translateY(6px)}to{opacity:.9;transform:none}}
@media (prefers-reduced-motion:reduce){#splash .wm span,#splash .tg{animation:none;opacity:1}}
</style>
</head>
<body>
<div id="splash" role="status" aria-label="Loading D’tox"><div class="wm" aria-hidden="true"><span style="--i:0">D</span><span style="--i:1">’</span><span style="--i:2">t</span><span style="--i:3">o</span><span style="--i:4">x</span></div><div class="tg">D for Dextor</div></div>
<script>try{if(sessionStorage.getItem("dtox-splash"))document.getElementById("splash").remove()}catch(e){}</script>
<div class="app">
  <header>
    <div><h1>D’tox</h1><div class="tag">D for Dextor</div><div class="sub" id="sub"></div></div>
    <div class="hr"><span class="pill" id="streak"></span><button class="pill" id="theme" aria-label="Toggle light and dark mode"></button></div>
  </header>
  <div id="banner" role="status" aria-live="polite"></div>
  <main id="view"></main>
</div>
<nav aria-label="Main">
  <button id="n1"><b>☀︎</b>Today</button>
  <button id="n2"><b>▤</b>Weekly</button>
  <button id="n3"><b>◍</b>Food</button>
  <button id="n4"><b>✎</b>Plan</button>
</nav>
<script>
const P=[{k:"phys",n:"Physical",s:"Body",c:"var(--phys)"},{k:"prac",n:"Practice",s:"Skill",c:"var(--prac)"},{k:"peace",n:"Peace",s:"Mind",c:"var(--peace)"}];
const KEY="3p-tracker-v3",TKEY="3p-theme";
let storageOK=true;
const key=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const pd=k=>{const a=k.split("-");return new Date(+a[0],+a[1]-1,+a[2])};
const addDays=(k,n)=>{const d=pd(k);d.setDate(d.getDate()+n);return key(d)};
const esc=s=>String(s).replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));
const fmt=n=>Number(n).toLocaleString();
const r1=x=>Math.round(x*10)/10;
function defaults(){return{start:key(new Date()),tasks:[
 {id:"p1",p:"phys",n:"Workout",u:"min",base:20,step:5,unlock:1},
 {id:"p2",p:"phys",n:"Steps",u:"steps",base:6000,step:1000,unlock:1},
 {id:"p3",p:"phys",n:"Push-ups",u:"reps",base:10,step:3,unlock:2},
 {id:"s1",p:"prac",n:"Deliberate Practice",u:"min",base:20,step:5,unlock:1},
 {id:"m1",p:"peace",n:"Meditation",u:"min",base:5,step:2,unlock:1},
 {id:"m2",p:"peace",n:"Journaling",u:"lines",base:3,step:1,unlock:1},
 {id:"w1",p:"phys",n:"Drink water",u:"L",base:4,step:0,unlock:1,steps:4,rem:{on:true,times:["09:00","12:00","15:00","18:00"]}}],log:{},notes:{},stash:{},food:{},profile:{},weights:[],fdone:{},fired:{},v:5}}
const isObj=o=>!!o&&typeof o==="object"&&!Array.isArray(o);
const PK=["phys","prac","peace"];
function migrate(s){
 if(!isObj(s)||typeof s.start!=="string"||!/^\d{4}-\d{2}-\d{2}$/.test(s.start)||!Array.isArray(s.tasks)||!isObj(s.log))return null;
 s.tasks=s.tasks.filter(t=>isObj(t)&&t.id&&PK.indexOf(t.p)>-1).map(t=>({...t,id:String(t.id),n:String(t.n||"Task"),u:String(t.u||""),base:+t.base>0?+t.base:1,step:+t.step>=0?+t.step:0,unlock:Math.max(1,parseInt(t.unlock,10)||1),steps:Math.max(1,Math.min(12,parseInt(t.steps,10)||1)),rem:isObj(t.rem)&&Array.isArray(t.rem.times)?{on:!!t.rem.on,times:t.rem.times.map(String)}:{on:false,times:[]}}));
 s.notes=isObj(s.notes)?s.notes:{};s.stash=isObj(s.stash)?s.stash:{};s.food=isObj(s.food)?s.food:{};s.profile=isObj(s.profile)?s.profile:{};s.weights=Array.isArray(s.weights)?s.weights.filter(w=>isObj(w)&&w.d&&+w.kg>0):[];s.fdone=isObj(s.fdone)?s.fdone:{};s.fired=isObj(s.fired)?s.fired:{};s.v=5;return s}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));storageOK=true}catch(e){storageOK=false}}
function getRecovered(){try{const ks=[];for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k&&k.indexOf(KEY+"-recovered-")===0)ks.push(k)}ks.sort();return ks.length?localStorage.getItem(ks[ks.length-1]):""}catch(e){return""}}
let S=null,loadMsg="";
try{const raw=localStorage.getItem(KEY);
 if(raw){let p=null;try{p=JSON.parse(raw)}catch(e){}
  const needMig=isObj(p)&&p.v!==5,pv=isObj(p)?p.v:0;
  S=migrate(p);
  if(S&&needMig){try{if(localStorage.getItem(KEY+"-pre-v"+(pv||3))===null)localStorage.setItem(KEY+"-pre-v"+(pv||3),raw)}catch(e){}}
  if(!S){try{localStorage.setItem(KEY+"-recovered-"+Date.now(),raw)}catch(e){}
   loadMsg="Your saved data couldn’t be read. A recoverable copy was kept (see Plan → Backup) and a fresh plan was started."}}
}catch(e){storageOK=false}
if(!S)S=defaults();
save();
function toggleTask(tk,dk){
 const T=tgt(tk,dk);if(!tk||!isAct(tk,dk)||!(T>0))return;
 const L=(S.log[dk]=S.log[dk]||{}),St=(S.stash[dk]=S.stash[dk]||{}),a=+L[tk.id]||0,s=St[tk.id];
 if(a>=T){if(s!==undefined&&s<T){L[tk.id]=s;delete St[tk.id]}else{St[tk.id]=a;L[tk.id]=0}}
 else{if(s!==undefined&&s>=T){L[tk.id]=s;delete St[tk.id]}else{St[tk.id]=a;L[tk.id]=T}}
 save();render()}
const TK=key(new Date());
let cur=TK,tab=1,vw=null,ed=null,err="",showBk=false;
const dayNum=dk=>Math.round((pd(dk)-pd(S.start))/864e5);
const wkOf=dk=>dayNum(dk)<0?0:Math.floor(dayNum(dk)/7)+1;
const curWeek=()=>wkOf(TK);
const weekDays=w=>Array.from({length:7},(_,i)=>addDays(S.start,(w-1)*7+i));
const rnd=v=>v<=0?0:v>=1000?Math.round(v/50)*50:Math.max(1,Math.round(v));
const wkT=(t,w)=>rnd(t.base+t.step*Math.max(w-t.unlock,0));
const isAct=(t,dk)=>{const w=wkOf(dk);return w>=1&&t.unlock<=w&&!(t.end&&dk>=t.end)};
const act=(pk,dk)=>S.tasks.filter(t=>t.p===pk&&isAct(t,dk));
function tgt(t,dk){const n=dayNum(dk);if(n<0)return 0;const d=n%7,w=Math.floor(n/7)+1;
 return rnd((t.base+t.step*Math.max(w-t.unlock,0))*((t.steps||1)>1?1:0.85+0.05*d))}
function tscore(t,dk){const T=tgt(t,dk);if(!(T>0))return null;const a=+((S.log[dk]||{})[t.id])||0;return Math.min(Math.max(a,0)/T,1)}
function score(dk,pk){const v=act(pk,dk).map(t=>tscore(t,dk)).filter(x=>x!==null);return v.length?v.reduce((a,b)=>a+b,0)/v.length:null}
const logged=dk=>{const l=S.log[dk];return !!l&&Object.keys(l).some(k=>+l[k]>0)};
const qual=dk=>P.every(p=>{const s=score(dk,p.k);return s!==null&&s>=0.6});
function streak(){let d=TK,n=0;if(!qual(d))d=addDays(d,-1);while(d>=S.start&&qual(d)){n++;d=addDays(d,-1)}return n}
function wstats(w){const ds=weekDays(w),el=ds.filter(d=>d<=TK&&d>=S.start).length,miss=ds.map(d=>d<=TK&&d>=S.start&&!logged(d));
 return{ds,el,miss,full:ds[6]<=TK,pl:P.map(p=>{const sc=ds.map(d=>d>TK?null:(score(d,p.k)||0));let run=0;
  const cum=sc.map(s=>s===null?null:(run+=s*100));return{p,sc,cum,total:run,avg:el?run/100/el:0}})}}
function applyTheme(){let t=null;try{t=localStorage.getItem(TKEY)}catch(e){}
 if(t!=="light")t="dark";
 document.documentElement.setAttribute("data-theme",t);
 document.getElementById("theme").textContent=t==="dark"?"☀︎":"☾"}
function render(){
 applyTheme();
 const w=curWeek();
 document.getElementById("sub").textContent=dayNum(TK)<0?"Program starts "+S.start:"Week "+w+" · Day "+(dayNum(TK)%7+1);
 document.getElementById("streak").textContent="🔥 "+streak()+"-day streak";
 document.getElementById("banner").innerHTML=(loadMsg?'<div class="banner">'+esc(loadMsg)+'</div>':"")+(storageOK?"":'<div class="banner">⚠ Changes could not be saved: browser storage is unavailable or full. Open the Plan tab and copy a backup so nothing is lost.</div>');
 [1,2,3,4].forEach(i=>document.getElementById("n"+i).className=tab===i?"on":"");
 document.getElementById("view").innerHTML=tab===1?today():tab===2?weekly():tab===3?food():plan();
}
function today(){
 const n=dayNum(cur),w=wkOf(cur),isT=cur===TK,l=S.log[cur]||{};
 const lab=isT?"Today":pd(cur).toLocaleDateString(undefined,{weekday:"long",month:"short",day:"numeric"});
 let h='<div class="datebar"><button data-a="prev" aria-label="Previous day">‹</button><div><b>'+lab+'</b><small>'+(n<0?"Before program start":"Week "+w+" · Day "+(n%7+1))+'</small><input type="date" id="dp" value="'+cur+'" aria-label="Choose date"></div><button data-a="next" aria-label="Next day">›</button></div>';
